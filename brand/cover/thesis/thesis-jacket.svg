<text x="297.64" y="302.00" text-anchor="middle" font-family="El Messiri, Noto Sans Arabic, sans-serif" font-size="13.85" font-weight="400" fill="#4A4238">مع تقييمات فورية ومساعد ذكاء اصطناعي محليّ</text>
