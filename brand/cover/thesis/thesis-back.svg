<text x="297.64" y="168.00" text-anchor="middle" font-family="El Messiri, Noto Sans Arabic, sans-serif" font-size="15.77" font-weight="700" fill="#8A6520">الملخص</text>
<text x="297.64" y="206.00" text-anchor="middle" font-family="El Messiri, Noto Sans Arabic, sans-serif" font-size="13.85" font-weight="400" fill="#4A4238">يتناول هذا المشروع تصميم منصّة تعليمية تكيّفيّة</text>
<text x="297.64" y="238.00" text-anchor="middle" font-family="El Messiri, Noto Sans Arabic, sans-serif" font-size="13.85" font-weight="400" fill="#4A4238">تقيس كفاءات المتدرّب، وتحلّل فجوات مهاراته،</text>
<text x="297.64" y="270.00" text-anchor="middle" font-family="El Messiri, Noto Sans Arabic, sans-serif" font-size="13.85" font-weight="400" fill="#4A4238">وترسم له مسارًا شخصيًا منظّمًا نحو الهدف الوظيفي،</text>
<text x="297.64" y="302.00" text-anchor="middle" font-family="El Messiri, Noto Sans Arabic, sans-serif" font-size="13.85" font-weight="400" fill="#4A4238">مع تقييمات فورية ومساعد ذكاء اصطناعي محليّ</text>
<text x="297.64" y="334.00" text-anchor="middle" font-family="El Messiri, Noto Sans Arabic, sans-serif" font-size="13.85" font-weight="400" fill="#4A4238">يحافظ على خصوصية المستخدم وسلامة بياناته.</text>
</g>
